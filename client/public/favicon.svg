<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" fill="url(#bg)" rx="15"/>
  
  <!-- Music note -->
  <g fill="#00ff00" filter="url(#glow)">
    <!-- Note stem -->
    <rect x="60" y="25" width="6" height="45" rx="3"/>
    
    <!-- Note head -->
    <ellipse cx="53" cy="70" rx="12" ry="9" transform="rotate(-25 53 70)"/>
    
    <!-- Equalizer bars -->
    <rect x="20" y="50" width="5" height="30" rx="2.5"/>
    <rect x="30" y="40" width="5" height="40" rx="2.5"/>
    <rect x="40" y="55" width="5" height="25" rx="2.5"/>
  </g>
  
  <!-- Border -->
  <rect width="96" height="96" x="2" y="2" fill="none" stroke="#00ff00" stroke-width="2" rx="13" opacity="0.5"/>
</svg>
