# Synology Container Manager → Project → Create
#
# Runs the published npm package with npx. No image build and no volumes;
# uses node:22-alpine only.
#
# Set MPD_HOST / MPD_PORT to wherever MPD is running:
#   - MPD on another machine: its IP or hostname, e.g. 192.168.1.50
#   - MPD on the NAS itself: host.docker.internal (mapped below)
#
# To upgrade, bump the version in the npx line and rebuild the project.

version: "3.8"

services:
  mpoly:
    image: node:22-alpine
    restart: unless-stopped
    ports:
      # Host port (left) — override if 3001 is taken, e.g. UI_PORT=3002 docker compose up
      - "${UI_PORT:-3001}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MPD_HOST: "host.docker.internal"
      MPD_PORT: "6600"
      PORT: "3001"
    command:
      - /bin/sh
      - -c
      - |
        rm -rf /root/.npm/_npx 2>/dev/null || true
        exec npx --yes @emgeebee/mpoly@2.1.0
