name: Publish to NPM

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Determine version and check npm
        id: version
        run: |
          VERSION=$(node -p "require('./server/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@emgeebee/mpoly@$VERSION" version >/dev/null 2>&1; then
            echo "@emgeebee/mpoly@$VERSION is already published; skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies (server)
        if: steps.version.outputs.publish == 'true'
        run: |
          cd server
          npm ci

      - name: Install dependencies (client)
        if: steps.version.outputs.publish == 'true'
        run: |
          cd client
          npm ci

      - name: Build client
        if: steps.version.outputs.publish == 'true'
        run: |
          cd client
          npm run build

      - name: Prepare package for publishing
        if: steps.version.outputs.publish == 'true'
        run: |
          # Create dist directory structure
          mkdir -p dist
          
          # Copy server files
          cp -r server/* dist/
          
          # Copy built client to dist
          mkdir -p dist/client
          cp -r client/dist dist/client/
          
          # Copy essential files
          cp README.md dist/README.md
          cp LICENSE dist/ 2>/dev/null || echo "No LICENSE file"
          
          # Update package.json for publishing
          node scripts/prepare-publish.js

      - name: Publish to NPM
        if: steps.version.outputs.publish == 'true'
        run: |
          cd dist
          npm publish --access public

      - name: Create GitHub Release
        if: steps.version.outputs.publish == 'true'
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "Release v${{ steps.version.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
